name: TailDeskCommanderMCP packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taildesk-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-22.04 }
          - { platform: linux-arm64, runner: ubuntu-22.04-arm }
          - { platform: windows-x64, runner: windows-2025 }
          - { platform: macos-arm64, runner: macos-15 }
          - { platform: macos-x64, runner: macos-15-intel }
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Select Rust stable
        run: rustup default stable
      - name: Install AppImage build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build and stage Desktop Commander
        run: |
          npm ci --include=dev --ignore-scripts --no-audit
          npm run build
          npm --prefix desktop ci --no-audit
          npm --prefix desktop run prepare-runtime
      - name: Test OAuth and MCP
        run: node --test test/integration/chatgpt-mcp.js
      - name: Package AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm --prefix desktop run tauri build -- --bundles appimage
      - name: Build standalone Windows executable
        if: runner.os == 'Windows'
        run: npm --prefix desktop run tauri build -- --no-bundle
      - name: Test unpacking the embedded Windows runtime
        if: runner.os == 'Windows'
        run: cargo test --locked --release --manifest-path desktop/src-tauri/Cargo.toml runtime::tests
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          npm --prefix desktop run tauri build -- --bundles app
          app='desktop/src-tauri/target/release/bundle/macos/Desktop Commander Connect.app'
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          ditto -c -k --keepParent "$app" DesktopCommanderConnect-${{ matrix.platform }}.zip
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-commander-connect-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/desktop-commander-connect.exe
            DesktopCommanderConnect-*.zip

  verified:
    name: Desktop packages verified
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: portable
    steps:
      - name: Require every platform build and test to pass
        env:
          MATRIX_RESULT: ${{ needs.portable.result }}
        run: test "$MATRIX_RESULT" = success
