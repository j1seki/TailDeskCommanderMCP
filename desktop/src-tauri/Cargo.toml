[package]
name = "desktop-commander-connect"
version = "0.3.6"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2.5"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
which = "8"

[profile.release]
strip = true
